name: Check
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  test:
    name: test-${{ matrix.runner}}-${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
        image:
          - zeek-8.0
          - zeek-9.0
          - zeek-dev
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - run: |
        docker build -t ${{ matrix.image }}-nats -f docker/${{ matrix.image }}.Dockerfile .
        docker run --rm ${{ matrix.image }}-nats /zeek-nats/testing/container.sh
